services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  agent:
    build:
      context: ./agent
    env_file:
      - ./agent/.env
    volumes:
      - ./agent:/app
    command: python main.py dev
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  frontend_node_modules:
